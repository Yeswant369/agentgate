name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the Vercel Python runtime, deliberately older than local dev:
          # incompatibilities surface here, not in production.
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check gateway/ tests/ api/
      - run: ruff format --check gateway/ tests/ api/
      - run: mypy gateway/
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
