name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentgate
          POSTGRES_PASSWORD: agentgate
          POSTGRES_DB: agentgate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A real Postgres for the DB-backed tests (idempotency, webhook replay).
      DATABASE_URL: postgresql+psycopg://agentgate:agentgate@localhost:5432/agentgate_test
      RAZORPAY_KEY_ID: rzp_test_ci_dummy
      RAZORPAY_KEY_SECRET: ci_dummy_secret
      RAZORPAY_WEBHOOK_SECRET: ci_dummy_webhook_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the Vercel Python runtime, deliberately older than local dev:
          # incompatibilities surface here, not in production.
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check gateway/ tests/ scripts/ api/
      - run: ruff format --check gateway/ tests/ scripts/ api/
      - run: mypy gateway/
      - run: alembic upgrade head
      - run: pytest -q
      # Eval regression + mutation gate: a rule change that lets an attack
      # through, or a mutation the suite stops catching, fails the build.
      - run: python -m evals.run --no-persist

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
